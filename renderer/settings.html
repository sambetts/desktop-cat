<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Desktop Cat</title>
<style>
:root{--accent:#b9742f;--accent-strong:#8a521c;--line:#d9d2c7;--muted:#5f5a54;--card:#fbf8f3;--focus:#2563eb}
*{box-sizing:border-box}
body{font:14px system-ui,sans-serif;margin:0;padding:18px 20px 24px;color:#222;background:#fff}
h1{font-size:20px;margin:0 0 14px}h2{font-size:15px;margin:22px 0 8px}
label{display:block;margin:10px 0 4px}
input[type=range]{width:100%;accent-color:var(--accent)}
.row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.value{font-weight:600;color:var(--accent-strong)}
button{font:inherit;padding:6px 12px;border:1px solid #b9b2a8;border-radius:6px;background:#fff;color:#222;cursor:pointer;min-height:32px}
button:hover{background:#f4efe8}
button.primary{background:var(--accent-strong);border-color:var(--accent-strong);color:#fff}
button.primary:hover{background:#6f4115}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{padding:0}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px;margin-top:8px}
.card{position:relative;border:2px solid var(--line);border-radius:10px;background:var(--card);display:flex;flex-direction:column;transition:border-color .15s}
.card:hover{border-color:#b9a991}
.card:has(input:checked){border-color:var(--accent-strong);background:#fdf3e7}
.card:has(input:focus-visible){outline:2px solid var(--focus);outline-offset:2px}
.card label{margin:0;padding:8px 8px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;flex:1}
.card canvas{width:112px;height:88px;image-rendering:pixelated}
.card .name{font-weight:600}
.card .desc{font-size:12px;color:var(--muted)}
.card .tag{display:none;font-size:11px;font-weight:600;color:#fff;background:var(--accent-strong);border-radius:999px;padding:1px 8px;margin-top:3px}
.card:has(input:checked) .tag{display:inline-block}
.card .actions{display:flex;justify-content:center;gap:4px;padding:0 6px 8px}
.card .actions button{padding:3px 8px;font-size:12px;min-height:28px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
#status{min-height:20px;margin:8px 0 0;font-size:13px;color:var(--muted)}
#status.error{color:#a3261b}
dialog{border:1px solid var(--line);border-radius:12px;padding:18px 20px;width:min(520px,calc(100vw - 24px));max-height:calc(100vh - 24px)}
dialog::backdrop{background:rgba(20,16,24,.45)}
dialog h2{margin:0 0 10px}
.previews{display:flex;gap:8px;margin-bottom:6px}
.previews canvas{width:50%;height:96px;border-radius:8px;image-rendering:pixelated}
#previewSit{background:#f5eee1}#previewWalk{background:#202735}
.fields input[type=text],.fields select{width:100%;font:inherit;padding:5px 8px;border:1px solid #b9b2a8;border-radius:6px}
.colours{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 14px}
.colours label{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:13px}
input[type=color]{width:36px;height:28px;padding:0 2px;border:1px solid #b9b2a8;border-radius:6px;background:#fff;flex:none;cursor:pointer}
.points{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.points label{display:flex;align-items:center;gap:8px}
#builderError{color:#a3261b;min-height:18px;margin:8px 0 0;font-size:13px}
.buttons{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<h1>🐾 Desktop Cat</h1>

<fieldset id="galleryGroup">
  <legend><h2 style="margin-top:0">Choose your cat</h2></legend>
  <div id="gallery" class="gallery"></div>
</fieldset>
<div class="toolbar">
  <button type="button" id="build">Build a cat…</button>
  <button type="button" id="import">Import a cat…</button>
</div>
<p id="status" role="status" aria-live="polite"></p>

<h2>Size</h2>
<label for="scale">Cat size: <span id="scaleName" class="value"></span></label>
<input id="scale" type="range" min="1" max="6" step="1">
<div class="row"><span>Tiny</span><span>Giant</span></div>

<h2>Behaviour</h2>
<label for="interest">Interest: <span id="lvl" class="value"></span></label>
<input id="interest" type="range" min="0" max="4" step="1">
<div class="row"><span>Ignore everything</span><span>Play with everything</span></div>
<label><input id="nightSleep" type="checkbox"> Sleep at night (23:00–07:00)</label>
<label><input id="launchAtLogin" type="checkbox"> Start at login</label>

<dialog id="builder" aria-labelledby="builderTitle">
  <form id="builderForm" class="fields" novalidate>
    <h2 id="builderTitle">Build a cat</h2>
    <div class="previews" aria-hidden="true"><canvas id="previewSit"></canvas><canvas id="previewWalk"></canvas></div>
    <label for="catName">Name</label>
    <input id="catName" type="text" maxlength="40" required autocomplete="off">
    <label for="catDescription">Description <span class="row" style="display:inline">(optional)</span></label>
    <input id="catDescription" type="text" maxlength="60" placeholder="e.g. Grey tabby" autocomplete="off">
    <label for="catAuthor">Made by <span class="row" style="display:inline">(optional, shown when you share it)</span></label>
    <input id="catAuthor" type="text" maxlength="60" autocomplete="off">
    <label for="startFrom">Start from</label>
    <select id="startFrom"></select>
    <fieldset>
      <legend><h2 style="margin:14px 0 4px;font-size:14px">Colours</h2></legend>
      <div id="colours" class="colours"></div>
    </fieldset>
    <div class="points">
      <label><input id="pointsOn" type="checkbox"> Colour points (Siamese-style face, legs and tail)</label>
      <label for="pointsColour">Points colour <input id="pointsColour" type="color" value="#5e4436"></label>
    </div>
    <p id="builderError" role="alert"></p>
    <div class="buttons">
      <button type="button" id="cancel">Cancel</button>
      <button type="submit" class="primary" id="save">Save cat</button>
    </div>
  </form>
</dialog>

<script src="coats.js"></script>
<script src="pixel-cat.js"></script>
<script>
const LEVELS = ['Ignore everything', 'Aloof', 'Curious', 'Playful', 'Play with everything'];
const SIZES = ['Tiny', 'Small', 'Normal', 'Large', 'Huge', 'Giant'];
const $ = (id) => document.getElementById(id);
let settings = null, galleryKey = null, draft = null, previewFrame = 0;

const dpr = () => window.devicePixelRatio || 1;
// Draws a cat crisply at whole device pixels into a canvas shown at `width`×`height` CSS pixels.
function drawCat(canvas, coat, pose, width, height, cssScale) {
  const ratio = dpr(), scale = Math.max(1, Math.round(cssScale * ratio));
  canvas.width = Math.round(width * ratio); canvas.height = Math.round(height * ratio);
  const ctx = canvas.getContext('2d');
  pixelCat.drawCoat(ctx, { x: canvas.width / 2, y: canvas.height - Math.round(6 * ratio), dir: 1, state: 'sit', t: 1, vx: 0, vy: 0, air: false, swat: 0, ...pose }, coat, scale);
}
function setStatus(message, error = false) { $('status').textContent = message; $('status').classList.toggle('error', error); }

function renderGallery() {
  const cats = catCoats.all(settings.customCats), gallery = $('gallery');
  gallery.replaceChildren(...cats.map((coat) => {
    const card = document.createElement('div');
    card.className = 'card';
    const label = document.createElement('label');
    const input = Object.assign(document.createElement('input'), { type: 'radio', name: 'coat', value: coat.id, className: 'sr-only' });
    input.onchange = () => { if (input.checked) window.catApi.setSettings({ coat: coat.id }); };
    const canvas = document.createElement('canvas');
    canvas.setAttribute('aria-hidden', 'true');
    drawCat(canvas, coat, {}, 112, 88, 2);
    const name = Object.assign(document.createElement('span'), { className: 'name', textContent: coat.name });
    const description = [coat.description, coat.author && `by ${coat.author}`].filter(Boolean).join(' · ');
    const desc = Object.assign(document.createElement('span'), { className: 'desc', textContent: description || 'Your cat' });
    const tag = Object.assign(document.createElement('span'), { className: 'tag', textContent: 'Selected' });
    tag.setAttribute('aria-hidden', 'true');
    label.append(input, canvas, name, desc, tag);
    card.append(label);
    if (!coat.builtIn) {
      const actions = document.createElement('div');
      actions.className = 'actions';
      const button = (text, aria, onclick) => {
        const b = Object.assign(document.createElement('button'), { type: 'button', textContent: text, onclick });
        b.setAttribute('aria-label', `${aria} ${coat.name}`);
        return b;
      };
      actions.append(
        button('Edit', 'Edit', () => openBuilder(coat)),
        button('Share', 'Share', () => exportCat(coat)),
        button('Delete', 'Delete', () => deleteCat(coat)),
      );
      card.append(actions);
    }
    return card;
  }));
}

function applySettings(s) {
  settings = s;
  const key = JSON.stringify(s.customCats);
  if (key !== galleryKey) { galleryKey = key; renderGallery(); }
  for (const input of document.querySelectorAll('input[name=coat]')) input.checked = input.value === s.coat;
  $('interest').value = s.interest; $('lvl').textContent = LEVELS[s.interest];
  $('scale').value = s.scale; $('scaleName').textContent = SIZES[s.scale - 1];
  $('nightSleep').checked = s.nightSleep; $('launchAtLogin').checked = s.launchAtLogin;
}
window.catApi.onSettings(applySettings);
window.catApi.getSettings().then((s) => { if (!settings) applySettings(s); });

$('interest').oninput = () => { $('lvl').textContent = LEVELS[$('interest').value]; window.catApi.setSettings({ interest: +$('interest').value }); };
$('scale').oninput = () => { $('scaleName').textContent = SIZES[$('scale').value - 1]; window.catApi.setSettings({ scale: +$('scale').value }); };
for (const k of ['nightSleep', 'launchAtLogin']) $(k).onchange = () => window.catApi.setSettings({ [k]: $(k).checked });

async function exportCat(coat) {
  const result = await window.catApi.exportCat(coat.id);
  if (result.error) setStatus(result.error, true);
  else if (!result.canceled) setStatus(`Saved ${coat.name} to ${result.file}. Send the file to a friend so they can import it.`);
}
async function deleteCat(coat) {
  if (!confirm(`Delete ${coat.name}? This can't be undone.`)) return;
  const result = await window.catApi.deleteCat(coat.id);
  setStatus(result.error || `Deleted ${coat.name}.`, !!result.error);
  if (!result.error) $('build').focus();
}
$('import').onclick = async () => {
  const result = await window.catApi.importCat();
  if (result.error) setStatus(`Couldn't import that cat: ${result.error}.`, true);
  else if (!result.canceled) setStatus(`Welcome, ${result.name}!`);
};

// ---- builder ----
const pointsOf = (coat) => coat.points ? { ...coat.points } : null;
function colourInputs() {
  $('colours').replaceChildren(...catCoats.slots.map((slot) => {
    const label = document.createElement('label');
    const input = Object.assign(document.createElement('input'), { type: 'color', id: `colour-${slot.name}` });
    input.oninput = () => { draft.palette[slot.name] = input.value; };
    label.append(input, slot.label);
    return label;
  }));
}
function showDraft() {
  for (const slot of catCoats.slots) $(`colour-${slot.name}`).value = draft.palette[slot.name];
  $('pointsOn').checked = !!draft.points;
  $('pointsColour').value = draft.points ? draft.points.fur : catCoats.mix(draft.palette.fur, '#000000', 0.55);
  $('pointsColour').disabled = !draft.points;
}
function startFrom(coat) {
  draft.palette = { ...coat.palette }; draft.points = pointsOf(coat);
  showDraft();
}
function openBuilder(coat) {
  const base = coat || catCoats.find(settings.coat, settings.customCats);
  draft = coat
    ? { id: coat.id, palette: { ...coat.palette }, points: pointsOf(coat) }
    : { palette: { ...base.palette }, points: pointsOf(base) };
  $('builderTitle').textContent = coat ? `Edit ${coat.name}` : 'Build a cat';
  $('catName').value = coat ? coat.name : '';
  $('catDescription').value = coat?.description || '';
  $('catAuthor').value = coat?.author || '';
  $('startFrom').replaceChildren(...catCoats.all(settings.customCats).map((c) =>
    Object.assign(document.createElement('option'), { value: c.id, textContent: c.name, selected: c.id === base.id })));
  $('builderError').textContent = '';
  showDraft();
  $('builder').showModal();
  $('catName').focus();
  animatePreview();
}
function animatePreview() {
  cancelAnimationFrame(previewFrame);
  if (!$('builder').open) return;
  const coat = { palette: draft.palette, points: draft.points || undefined }, t = performance.now() / 1000;
  drawCat($('previewSit'), coat, { t }, $('previewSit').clientWidth || 220, 96, 2);
  drawCat($('previewWalk'), coat, { state: 'walk', vx: 60, t, dir: 1 }, $('previewWalk').clientWidth || 220, 96, 2);
  previewFrame = requestAnimationFrame(animatePreview);
}
$('startFrom').onchange = () => startFrom(catCoats.find($('startFrom').value, settings.customCats));
$('pointsOn').onchange = () => {
  draft.points = $('pointsOn').checked ? catCoats.derivePoints($('pointsColour').value) : null;
  $('pointsColour').disabled = !draft.points;
};
$('pointsColour').oninput = () => { if (draft.points) draft.points = catCoats.derivePoints($('pointsColour').value); };
$('cancel').onclick = () => $('builder').close();
$('builder').addEventListener('close', () => cancelAnimationFrame(previewFrame));
$('build').onclick = () => openBuilder(null);
$('builderForm').onsubmit = async (event) => {
  event.preventDefault();
  const name = $('catName').value.trim();
  if (!name) { $('builderError').textContent = 'Give your cat a name.'; $('catName').focus(); return; }
  const cat = { ...draft, name, description: $('catDescription').value, author: $('catAuthor').value };
  if (!cat.points) delete cat.points;
  const result = await window.catApi.saveCat(cat);
  if (result.error) { $('builderError').textContent = result.error; return; }
  $('builder').close();
  setStatus(`Saved ${name}.`);
};
colourInputs();
</script>
</body>
</html>
