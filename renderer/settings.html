<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<style>
body{font:14px system-ui,sans-serif;margin:18px;color:#222}
h2{margin:0 0 12px}label{display:block;margin:10px 0 4px}
input[type=range]{width:100%}.row{display:flex;justify-content:space-between;font-size:11px;color:#666}
#lvl{font-weight:600;color:#b9742f}
</style>
</head>
<body>
<h2>🐾 Desktop Cat</h2>
<label>Interest: <span id="lvl"></span></label>
<input id="interest" type="range" min="0" max="4" step="1">
<div class="row"><span>Ignore everything</span><span>Play with everything</span></div>
<label><input id="nightSleep" type="checkbox"> Sleep at night (23:00–07:00)</label>
<label><input id="launchAtLogin" type="checkbox"> Start at login</label>
<script>
const LEVELS = ['Ignore everything', 'Aloof', 'Curious', 'Playful', 'Play with everything'];
const $ = (id) => document.getElementById(id);
const show = () => { $('lvl').textContent = LEVELS[$('interest').value]; };
window.catApi.onSettings((s) => {
  $('interest').value = s.interest;
  $('nightSleep').checked = s.nightSleep; $('launchAtLogin').checked = s.launchAtLogin; show();
});
$('interest').oninput = () => { show(); window.catApi.setSettings({ interest: +$('interest').value }); };
for (const k of ['nightSleep', 'launchAtLogin']) $(k).onchange = () => window.catApi.setSettings({ [k]: $(k).checked });
</script>
</body>
</html>
